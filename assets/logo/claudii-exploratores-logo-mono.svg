<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 212 212" width="212" height="212" role="img" aria-label="Claudii Exploratores">


  <!-- crest: a network rising from the top of the helmet -->
  <g stroke-linecap="round" fill="none">
    <!-- diagonal mesh -->
    <g stroke="#1b2333" stroke-width="2" stroke-opacity=".45">
      <line x1="80" y1="124" x2="69" y2="76"/>
      <line x1="92" y1="104" x2="98" y2="58"/>
      <line x1="110" y1="92" x2="130" y2="52"/>
      <line x1="130" y1="88" x2="161" y2="55"/>
      <line x1="150" y1="89" x2="190" y2="70"/>
    </g>
    <!-- spokes -->
    <g stroke="#1b2333" stroke-width="3.2">
      <line x1="80" y1="124" x2="46" y2="106"/>
      <line x1="92" y1="104" x2="69" y2="76"/>
      <line x1="110" y1="92" x2="98" y2="58"/>
      <line x1="130" y1="88" x2="130" y2="52"/>
      <line x1="150" y1="89" x2="161" y2="55"/>
      <line x1="170" y1="97" x2="190" y2="70"/>
    </g>
    <!-- outer chain -->
    <polyline points="46,106 69,76 98,58 130,52 161,55 190,70" stroke="#1b2333" stroke-width="3.2"/>
  </g>
  <g fill="#ffffff" stroke="#1b2333" stroke-width="3">
    <circle cx="46" cy="106" r="6.5"/>
    <circle cx="69" cy="76" r="6.5"/>
    <circle cx="98" cy="58" r="6.5"/>
    <circle cx="130" cy="52" r="7.5"/>
    <circle cx="161" cy="55" r="6.5"/>
    <circle cx="190" cy="70" r="6.5"/>
  </g>

  <!-- helmet (galea), facing right: bowl, brim, cheek guard, flared neck guard -->
  <path d="M74 172 C66 126 90 90 130 88 C170 86 198 114 200 146 L214 151 L162 153 L158 163 L184 167 L176 216 L142 220 L134 181 L106 185 L78 191 L50 199 L58 185 Z"
        fill="#ffffff" stroke="#1b2333" stroke-width="7" stroke-linejoin="round"/>
  <!-- brow band -->
  <path d="M82 152 C108 140 154 138 200 146" fill="none" stroke="#1b2333" stroke-width="4.5" stroke-linecap="round"/>
  <!-- ridge nodes where the crest meets the bowl -->
  <g fill="#1b2333">
    <circle cx="80" cy="124" r="4.5"/>
    <circle cx="92" cy="104" r="4.5"/>
    <circle cx="110" cy="92" r="4.5"/>
    <circle cx="130" cy="88" r="4.5"/>
    <circle cx="150" cy="89" r="4.5"/>
    <circle cx="170" cy="97" r="4.5"/>
  </g>
  <!-- ear opening -->
  <circle cx="114" cy="166" r="9" fill="none" stroke="#1b2333" stroke-width="5"/>
  <!-- circuit trace on the cheek guard, as on the Exploratores helmet -->
  <path d="M148 172 L162 172 L168 188 L163 204" fill="none" stroke="#1b2333" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="163" cy="204" r="3" fill="#1b2333"/>
</svg>
