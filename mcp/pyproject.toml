[project]
name = "claudii-exploratores-mcp"
version = "1.1.0a1"
description = "Claudii Exploratores — offline MCP server over the Exploratores OSINT catalog: indicator classification, curated OSINT search-URL building with VPN/Tor access warnings, IBAN validation and PII redaction."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ramingo (SOsintOps)" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
keywords = ["osint", "mcp", "model-context-protocol", "claude", "investigation", "intelligence", "iban", "redaction"]
dependencies = [
  "mcp>=1.2.0,<3",
]

[project.scripts]
claudii-exploratores-mcp = "exploratores_osint_mcp.server:main"

[project.urls]
Homepage = "https://github.com/SOsintOps/claudii-exploratores"
Upstream = "https://github.com/SOsintOps/Exploratores"
Changelog = "https://github.com/SOsintOps/claudii-exploratores/blob/main/docs/versionhistory.md"
Issues = "https://github.com/SOsintOps/claudii-exploratores/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exploratores_osint_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"exploratores_osint_mcp/catalog.json" = "exploratores_osint_mcp/catalog.json"
"exploratores_osint_mcp/access.json" = "exploratores_osint_mcp/access.json"
